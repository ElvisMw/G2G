<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory to God Vehicles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="bg-dark text-white py-3 mb-4">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <h1 class="h3 mb-0">Glory to God Vehicles</h1>
            <nav>
                <a class="btn btn-outline-light me-2" href="/">Dashboard</a>
                <a class="btn btn-outline-light me-2" href="/vehicles/">Vehicles</a>
                <a class="btn btn-outline-light me-2" href="/riders/">Riders</a>
                <a class="btn btn-outline-light me-2" href="/contracts/">Contracts</a>
                <a class="btn btn-outline-light me-2" href="/payments/">Payments</a>
                <a class="btn btn-outline-light me-2" href="/reports/">Reports</a>
            </nav>
        </div>
    </header>
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        &copy; 2026 Glory to God Vehicles
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
