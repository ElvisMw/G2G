<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory to God Vehicles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="saas-vertical-layout">
        <aside class="saas-sidebar">
            <!-- Logo removed from sidebar -->
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/vehicles/" class="{% if '/vehicles' in request.path %}active{% endif %}">Vehicles</a>
                <a href="/riders/" class="{% if '/riders' in request.path %}active{% endif %}">Riders</a>
                <a href="/contracts/" class="{% if '/contracts' in request.path %}active{% endif %}">Contracts</a>
                <a href="/payments/" class="{% if '/payments' in request.path %}active{% endif %}">Payments</a>
                <a href="/reports/" class="{% if '/reports' in request.path %}active{% endif %}">Reports</a>
            </nav>
        </aside>
        <div class="saas-main-content">
            <header class="bg-dark text-white py-3 mb-4">
                <div class="d-flex align-items-center gap-4">
                    <img src="/static/images/logo.png" alt="Logo" class="header-logo-big img-fluid" />
                    <div>
                        <h1 class="main-heading mb-1">Glory to God Vehicles</h1>
                        <div class="slogan text-info fw-semibold" style="font-size:1.35rem;">Empowering Mobility, Honoring Purpose</div>
                    </div>
                </div>
            </header>
            <main>
                <div class="saas-card">
                    {% block content %}{% endblock %}
                </div>
            </main>
            <footer class="bg-dark text-white text-center py-3 mt-auto">
                &copy; 2026 Glory to God Vehicles
            </footer>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
